  <!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أين السلوك الصحيح؟ - الطابور</title>
<style>
  :root{
    --purple:#6c5ce7;
    --green:#4caf50;
    --red:#ff7675;
    --text:#3a3a5c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    min-height:100%;
    background:linear-gradient(160deg,#fef6e4 0%, #e8f4fd 100%);
    font-family:Tahoma,'Segoe UI',sans-serif;
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 12px 40px;
    min-height:100vh;
  }

  /* ---------- sound toggle ---------- */
  .sound-toggle{
    position:fixed;
    top:14px; left:14px;
    z-index:50;
    width:46px;height:46px;
    border-radius:50%;
    border:none;
    background:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
    font-size:20px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease;
  }
  .sound-toggle:active{ transform:scale(.9); }

  /* ---------- header ---------- */
  .header{
    text-align:center;
    margin:8px 0 18px;
  }
  .title{
    font-size:20px;
    font-weight:800;
    color:var(--purple);
  }
  .subtitle{
    font-size:13px;
    font-weight:600;
    color:#7a7a9a;
    margin-top:4px;
  }

  /* ---------- levels screen ---------- */
  .levels-screen{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .level-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:#fff;
    border-radius:20px;
    padding:16px 18px;
    box-shadow:0 6px 18px rgba(0,0,0,.10);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    border:3px solid transparent;
  }
  .level-card:active{ transform:scale(.98); }
  .level-card .icon{
    font-size:34px;
    width:56px;height:56px;
    display:flex;align-items:center;justify-content:center;
    background:#f4f1ff;
    border-radius:16px;
    flex-shrink:0;
  }
  .level-card .info{ flex:1; text-align:right; }
  .lvl-title{ font-size:17px; font-weight:800; }
  .lvl-sub{ font-size:13px; font-weight:600; color:#8a8aa5; margin-top:2px;}
  .stars-mini{ font-size:14px; color:#f5b301; min-height:16px; }

  /* ---------- back button ---------- */
  .back-row{ width:100%; max-width:440px; display:none; margin-bottom:10px; }
  .back-btn{
    background:#fff;
    border:none;
    border-radius:14px;
    padding:10px 16px;
    font-size:13px;
    font-weight:700;
    color:var(--purple);
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    cursor:pointer;
  }

  /* ---------- prompt row ---------- */
  .prompt-row{
    width:100%;
    max-width:440px;
    display:none;
    align-items:center;
    gap:10px;
    background:#fff;
    border-radius:18px;
    padding:14px 16px;
    box-shadow:0 6px 18px rgba(0,0,0,.10);
    margin-bottom:14px;
  }
  .speak-btn{
    flex-shrink:0;
    width:48px;height:48px;
    border-radius:50%;
    border:none;
    background:var(--purple);
    color:#fff;
    font-size:22px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .speak-btn.playing{
    animation:pulse .6s ease-in-out infinite alternate;
  }
  @keyframes pulse{
    from{ box-shadow:0 0 0 0 rgba(108,92,231,.5); }
    to{ box-shadow:0 0 0 10px rgba(108,92,231,0); }
  }
  .prompt-box{
    flex:1;
    text-align:center;
    font-size:17px;
    font-weight:800;
    line-height:1.5;
    color:var(--text);
  }

  /* ---------- progress dots ---------- */
  .progress{
    display:none;
    gap:8px;
    margin-bottom:16px;
  }
  .dot{
    width:12px;height:12px;
    border-radius:50%;
    background:#dcdce6;
    transition:all .25s ease;
  }
  .dot.done{
    background:var(--green);
    transform:scale(1.15);
  }
  .dot.current{
    background:var(--purple);
    box-shadow:0 0 0 4px rgba(108,92,231,.25);
    transform:scale(1.25);
  }

  /* ---------- game area / cards ---------- */
  .game-area{
    width:100%;
    max-width:960px;
    display:none;
    flex-direction:column;
    align-items:center;
  }
  .cards{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .card{
    position:relative;
    width:100%;
    max-width:400px;
    background:#fff;
    border-radius:18px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    border:5px solid transparent;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, border-color .2s ease;
  }
  .card:active{ transform:scale(.98); }
  .card .img-wrap{
    width:100%;
    aspect-ratio:3/2;
    overflow:hidden;
    background:#f2f2f6;
  }
  .card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    image-rendering:auto;
    filter:none;
  }
  .card.correct{
    border-color:var(--green);
  }
  .card.wrong{
    border-color:var(--red);
    animation:shake .4s ease;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-8px); }
    80%{ transform:translateX(8px); }
  }
  .badge{
    position:absolute;
    top:8px; right:8px;
    background:var(--green);
    color:#fff;
    font-size:20px;
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transform:scale(.4);
    opacity:0;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
  }
  .badge.show{
    transform:scale(1);
    opacity:1;
  }
  .wrong-mark{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(58,58,92,.35);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .wrong-mark.show{ opacity:1; }
  .wrong-mark span{
    font-size:72px;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));
  }

  .feedback{
    min-height:30px;
    margin-top:16px;
    font-size:18px;
    font-weight:800;
    text-align:center;
    opacity:0;
    transition:opacity .25s ease;
  }
  .feedback.show{ opacity:1; }
  .feedback.ok{ color:var(--green); }
  .feedback.bad{ color:var(--red); }

  /* ---------- summary ---------- */
  .summary{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    background:#fff;
    border-radius:22px;
    padding:30px 24px;
    box-shadow:0 8px 24px rgba(0,0,0,.14);
    max-width:400px;
    width:100%;
  }
  .summary h2{
    margin:0 0 10px;
    color:var(--purple);
    font-size:22px;
  }
  .score{ font-size:16px; font-weight:700; margin-bottom:6px; }
  .stars{ font-size:32px; color:#f5b301; margin-bottom:10px; letter-spacing:4px; }
  #summaryMsg{ font-size:14px; color:#8a8aa5; margin-bottom:18px; }
  .btn-row{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .restart-btn,.levels-btn{
    border:none;
    border-radius:14px;
    padding:12px 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .restart-btn{ background:var(--purple); color:#fff; }
  .levels-btn{ background:#f2f0ff; color:var(--purple); }

  @media (max-width:480px){
    .title{ font-size:18px; }
    .prompt-box{ font-size:16px; }
  }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle" title="كتم/تشغيل الصوت">🔊</button>

<div class="header">
  <div class="title">🌟 أين السلوك الصحيح؟ 🌟</div>
  <div class="subtitle">الوقوف في الطابور بطريقة صحيحة</div>
</div>

<div class="levels-screen" id="levelsScreen">
  <div class="level-card" data-level="1">
    <div class="icon">🚶‍♂️</div>
    <div class="info">
      <div class="lvl-title">المستوى الأول</div>
      <div class="lvl-sub">اختر بين صورتين</div>
    </div>
    <div class="stars-mini" id="starsL1"></div>
  </div>
  <div class="level-card" data-level="2">
    <div class="icon">🎯</div>
    <div class="info">
      <div class="lvl-title">المستوى الثاني</div>
      <div class="lvl-sub">اختر بين ثلاث صور</div>
    </div>
    <div class="stars-mini" id="starsL2"></div>
  </div>
</div>

<div class="back-row" id="backRow">
  <button class="back-btn" id="backBtn">➡️ العودة للمستويات</button>
</div>

<div class="prompt-row" id="promptRow">
  <button class="speak-btn" id="speakBtn">🔈</button>
  <div class="prompt-box" id="promptBox">ما هو السلوك الصحيح عند الوقوف في الطابور؟</div>
</div>

<div class="progress" id="progress"></div>

<div class="game-area" id="gameArea">
  <div class="cards" id="cards"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="summary" id="summary">
  <h2>أحسنت! 🎉</h2>
  <div class="score" id="scoreText"></div>
  <div class="stars" id="starsText"></div>
  <div id="summaryMsg"></div>
  <div class="btn-row">
    <button class="restart-btn" id="restartBtn">🔁 إعادة المستوى</button>
    <button class="levels-btn" id="levelsBtn">📋 المستويات</button>
  </div>
</div>

  [audioQuestion, audioCorrect, audioWrong].forEach(function(a){ a.volume = 1.0; });

  var soundOn = true;
  var state = { level:null, repIndex:0, mistakesTotal:0, locked:false, wrongTimers:[] };
  var bestStars = { 1:0, 2:0 };

  function stopAllAudio(){
    [audioQuestion, audioCorrect, audioWrong].forEach(function(a){
      a.pause();
      a.currentTime = 0;
    });
  }

  function playAudio(a, onEnded){
    stopAllAudio();
    if(!soundOn){ if(onEnded) onEnded(); return; }
    a.currentTime = 0;
    a.volume = 1.0;
    var handled = false;
    function done(){
      if(handled) return;
      handled = true;
      a.removeEventListener('ended', done);
      if(onEnded) onEnded();
    }
    a.addEventListener('ended', done);
    var p = a.play();
    if(p && p.catch){
      p.catch(function(){ done(); });
    }
  }

  function setSpeakingUI(on){
    els.speakBtn.classList.toggle('playing', on);
  }

  function playQuestion(cb){
    setSpeakingUI(true);
    playAudio(audioQuestion, function(){
      setSpeakingUI(false);
      if(cb) cb();
    });
  }

  els.speakBtn.addEventListener('click', function(){
    playQuestion();
  });

  els.soundToggle.addEventListener('click', function(){
    soundOn = !soundOn;
    els.soundToggle.textContent = soundOn ? '🔊' : '🔇';
    if(!soundOn){ stopAllAudio(); setSpeakingUI(false); }
  });

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  /* ---------------- screens ---------------- */
  function showLevelsScreen(){
    stopAllAudio();
    state.level = null;
    els.levelsScreen.style.display = 'flex';
    els.backRow.style.display = 'none';
    els.promptRow.style.display = 'none';
    els.progress.style.display = 'none';
    els.gameArea.style.display = 'none';
    els.summary.style.display = 'none';
    renderMiniStars();
  }

  function renderMiniStars(){
    els.starsL1.textContent = bestStars[1] > 0 ? '★'.repeat(bestStars[1]) : '';
    els.starsL2.textContent = bestStars[2] > 0 ? '★'.repeat(bestStars[2]) : '';
  }

  document.querySelectorAll('.level-card').forEach(function(card){
    card.addEventListener('click', function(){
      var lvl = parseInt(card.getAttribute('data-level'), 10);
      startLevel(lvl);
    });
  });

  els.backBtn.addEventListener('click', showLevelsScreen);
  els.levelsBtn.addEventListener('click', showLevelsScreen);
  els.restartBtn.addEventListener('click', function(){ startLevel(state.level); });

  function startLevel(lvl){
    state.level = lvl;
    state.repIndex = 0;
    state.mistakesTotal = 0;
    els.levelsScreen.style.display = 'none';
    els.summary.style.display = 'none';
    els.backRow.style.display = 'block';
    els.promptRow.style.display = 'flex';
    els.progress.style.display = 'flex';
    els.gameArea.style.display = 'flex';
    renderProgress();
    startRepetition();
  }

  function renderProgress(){
    var total = LEVELS[state.level].total;
    els.progress.innerHTML = '';
    for(var i=0;i<total;i++){
      var d = document.createElement('div');
      d.className = 'dot';
      if(i < state.repIndex) d.className += ' done';
      else if(i === state.repIndex) d.className += ' current';
      els.progress.appendChild(d);
    }
  }

  /* ---------------- repetition ---------------- */
  function startRepetition(){
    state.locked = false;
    clearWrongTimers();
    els.feedback.className = 'feedback';
    els.feedback.textContent = '';
    els.promptBox.textContent = QUESTION_TEXT;

    var levelData = LEVELS[state.level];
    var order = shuffle(levelData.cards);

    els.cards.innerHTML = '';
    order.forEach(function(item){
      var card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-ok', item.ok ? '1' : '0');

      var wrap = document.createElement('div');
      wrap.className = 'img-wrap';
      var img = document.createElement('img');
      img.src = item.src;
      img.alt = item.ok ? 'السلوك الصحيح' : 'سلوك غير صحيح';
      img.draggable = false;
      wrap.appendChild(img);
      card.appendChild(wrap);

      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = '✅';
      card.appendChild(badge);

      var wrongMark = document.createElement('div');
      wrongMark.className = 'wrong-mark';
      wrongMark.innerHTML = '<span>❌</span>';
      card.appendChild(wrongMark);

      card.addEventListener('click', function(){ onCardClick(card); });
      els.cards.appendChild(card);
    });

    renderProgress();
    // تشغيل السؤال بصوت مرتفع وواضح عند بداية كل تكرار
    setTimeout(function(){ playQuestion(); }, 250);
  }

  function clearWrongTimers(){
    state.wrongTimers.forEach(function(t){ clearTimeout(t); });
    state.wrongTimers = [];
  }

  function onCardClick(card){
    if(state.locked) return;
    var isOk = card.getAttribute('data-ok') === '1';

    if(isOk){
      state.locked = true;
      clearWrongTimers();
      // إزالة أي علامات خطأ متبقية على البطاقات الأخرى
      els.cards.querySelectorAll('.wrong-mark.show').forEach(function(m){ m.classList.remove('show'); });
      els.cards.querySelectorAll('.card.wrong').forEach(function(c){ c.classList.remove('wrong'); });

      card.classList.add('correct');
      var badge = card.querySelector('.badge');
      badge.classList.add('show');

      els.feedback.textContent = 'ممتاز! 👏';
      els.feedback.className = 'feedback ok show';

      playAudio(audioCorrect, function(){
        setTimeout(nextStep, AFTER_CORRECT_PAUSE);
      });
    } else {
      state.mistakesTotal++;
      card.classList.remove('wrong');
      void card.offsetWidth; // إعادة تشغيل الأنيميشن
      card.classList.add('wrong');

      var mark = card.querySelector('.wrong-mark');
      mark.classList.add('show');

      els.feedback.textContent = 'حاول مرة أخرى 🙂';
      els.feedback.className = 'feedback bad show';

      playAudio(audioWrong);

      var t = setTimeout(function(){
        mark.classList.remove('show');
        card.classList.remove('wrong');
      }, WRONG_MARK_DURATION);
      state.wrongTimers.push(t);
    }
  }

  function nextStep(){
    state.repIndex++;
    if(state.repIndex >= LEVELS[state.level].total){
      finishLevel();
    } else {
      startRepetition();
    }
  }

  function finishLevel(){
    stopAllAudio();
    els.promptRow.style.display = 'none';
    els.progress.style.display = 'none';
    els.gameArea.style.display = 'none';
    els.backRow.style.display = 'none';
    els.summary.style.display = 'flex';

    var total = LEVELS[state.level].total;
    var stars = state.mistakesTotal === 0 ? 3 : (state.mistakesTotal <= 2 ? 2 : 1);
    bestStars[state.level] = Math.max(bestStars[state.level], stars);

    els.scoreText.textContent = 'أكملت ' + total + ' من ' + total + ' 🎯';
    els.starsText.textContent = '★'.repeat(stars) + '☆'.repeat(3-stars);
    els.summaryMsg.textContent = state.mistakesTotal === 0
      ? 'رائع! أجبت بشكل صحيح من أول محاولة في كل مرة!'
      : 'أحسنت! استمر بالتدريب لتصبح أفضل.';
  }

  showLevelsScreen();
})();
</script>
</body>
